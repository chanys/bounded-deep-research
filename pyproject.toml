[project]
name = "bounded-deep-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.0",
    "anthropic>=0.96.0",
    "fastapi>=0.136.0",
    "google-api-python-client>=2.194.0",
    "langfuse>=4.3.1",
    "openai>=2.32.0",
    "opensearch-py>=3.1.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.14.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.44.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
# Collect only from tests/. Without this, pytest walks the whole repository, which
# means web/, data/, and eval/artifacts/ get stat-ed on every run for nothing.
testpaths = ["tests"]
# Run bare `async def` tests without a per-test marker. Most of the interesting
# surface here (the agent loop, retrieval, tool dispatch) is async, and under the
# default strict mode an unmarked async test fails with "async def functions are
# not natively supported" rather than running.
asyncio_mode = "auto"
